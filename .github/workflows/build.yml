name: Build

# Builds every push and pull request except documentation-only ones. A tag
# vMAJOR.MINOR.PATCH also publishes a release with the notes in
# .github/release-notes/<tag>.md.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      # v1.2.3 gives 1.2.3 and a release; anything else is 0.0.<run number>.
      # Other tags starting with "v" fail, as likely mistyped releases.
      - name: Determine version
        id: version
        run: |
          is_release=false
          VERSION=0.0.$GITHUB_RUN_NUMBER
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              VERSION=${GITHUB_REF_NAME#v}
              is_release=true
            elif printf '%s\n' "$GITHUB_REF_NAME" | grep -q '^v'; then
              echo "::error::Release tags must be vMAJOR.MINOR.PATCH, not '$GITHUB_REF_NAME'."
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

      - name: Build
        run: sh build.sh

      - name: Check binary and packages
        run: |
          cat build/VERSION
          file build/chargectl
          tar -tvzf build/KoboRoot.tgz
          find build/dist -type f | sort

      # Each downloads as a ZIP; a release attaches the same two ZIPs.
      - uses: actions/upload-artifact@v4
        with:
          name: charge-limit-${{ env.VERSION }}-kobo
          path: build/dist/charge-limit-${{ env.VERSION }}-kobo/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: charge-limit-${{ env.VERSION }}-kindle
          path: build/dist/charge-limit-${{ env.VERSION }}-kindle/
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For the release notes file.
      - uses: actions/checkout@v4

      # One folder per artifact, named after it.
      - uses: actions/download-artifact@v4
        with:
          pattern: charge-limit-*
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          for d in charge-limit-*; do
            (cd "$d" && zip -qr "../$d.zip" .)
          done
          cd ..
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Charge limit $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
            --verify-tag
