name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Build
        run: sh build.sh

      - name: Check binary and package
        run: |
          file build/rootfs/usr/local/chargelimit/kobo-chg
          tar -tvzf build/KoboRoot.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: KoboRoot
          path: build/KoboRoot.tgz
          if-no-files-found: error
